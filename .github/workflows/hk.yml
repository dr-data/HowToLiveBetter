name: 香港版繁體中文內容檢查

on:
  push:
    branches: [main]
    paths:
      - 'hk/**'
      - '.github/workflows/hk.yml'
  pull_request:
    paths:
      - 'hk/**'
      - '.github/workflows/hk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 檢查腳本語法
        run: node --check hk/build.mjs
      - name: 核對資料與香港版 Markdown
        run: node hk/build.mjs --check
