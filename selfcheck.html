  ]},
  {name:'錢', mod:'錢', qs:[
    {sec:5, key:'自動續費', text:'關掉了不用的自動續費'},
    {sec:5, key:'個稅彙算', text:'每年做個稅彙算，該填的專項附加扣除都填了', hint:'沒有工資收入可以跳過'},
    {sec:5, key:'最低還款', text:'不用信用卡最低還款，不開消費分期和消費貸'},
    {sec:5, key:'先存出', text:'存了 3 到 6 個月生活費的應急金，能隨時取'},
    {sec:5, key:'高收益', text:'看到「保本」「高收益」「穩賺」會直接走開'},
    {sec:5, key:'家庭共濟', text:'在醫保 App 上辦了家庭共濟', hint:'沒有職工醫保可以跳過'},
    {sec:5, key:'三者險', text:'開車的話，三者險買夠了', hint:'沒有車可以跳過'},
    {sec:5, key:'定期壽險', text:'家裡有人靠你的收入過日子，你買了定期壽險', hint:'家裡沒人靠你收入可以跳過'},
    {sec:5, key:'寬基指數', text:'長期投資的錢放在寬基指數基金，而不是主動基金或個股', hint:'沒有投資可以跳過'},
  ]},
  {name:'賬號與防騙', mod:'賬號與防騙', qs:[
    {sec:14, key:'二次驗證', text:'郵箱、支付、社交賬號都開了二次驗證'},
    {sec:14, key:'郵箱密碼單獨', text:'郵箱密碼單獨一個，沒在別的網站用過'},
    {sec:14, key:'鎖屏密碼', text:'手機設了鎖屏密碼，SIM 卡設了 PIN 碼'},
    {sec:8, key:'通訊錄裡的舊號碼', text:'家人影片或電話要你轉賬，會先掛斷，用通訊錄裡的舊號碼打回去核實'},
    {sec:8, key:'不把銀行卡', text:'從不把銀行卡、手機卡、支付賬號借給別人'},
    {sec:8, key:'徵信報告', text:'查過自己的徵信報告'},
    {sec:8, key:'簽字前', text:'簽字前會把紙看完，不在空白紙上籤'},
  ]},
];
const MODS = ['身體', '急救常識', '精力', '錢', '賬號與防騙'];
const modOn = m => ans['mod:' + m] !== 'off';

/* 解析：和 index.html 的 parseReadme 同一套格式，只取這裡用得到的字段 */
const COST_W = { money:{'0':0,'少':1,'多':2}, time:{'少':0,'中':1,'多':2}, will:{'否':0,'些':1,'是':2} };
function parse(md){
  const out = []; let sec = null, e = null; let m;
  for (const raw of md.split(/\r?\n/)){
    const line = raw.trimEnd();
    if ((m = /^#{1,2} (\d+)\. /.exec(line))) { sec = +m[1]; e = null; continue; }
    if ((m = /^### (\d+)\. (.+)$/.exec(line)) && sec) { e = {sec, n:+m[1], title:m[2].trim(), human:'', cost:'', grade:'', note:''}; out.push(e); continue; }
    if (!e) continue;
    if ((m = /^\x3c!--\s*成本標籤:\s*(.*?)\s*-->/.exec(line))){
      for (const kv of m[1].split(/\s+/)){ const [k,v] = kv.split('='); const p = {'錢':'money','時間':'time','毅力':'will','收益':'level','口徑':'lens'}[k]; if (p) e[p] = v; }
    }
    else if ((m = /^- 說人話：(.*)$/.exec(line))) e.human = m[1];
    else if ((m = /^- 成本：(.*)$/.exec(line))) e.cost = m[1];
    else if ((m = /^- 證據等級：\s*([ABC])/.exec(line))) e.grade = m[1];
    else if ((m = /^- 備註：(.*)$/.exec(line))) e.note = m[1];
  }
  for (const x of out){
    x.cs = (COST_W.money[x.money] ?? 0) + (COST_W.time[x.time] ?? 0) + (COST_W.will[x.will] ?? 0);
    x.ratio = x.level === '大' ? (x.cs === 0 ? '極高' : (x.cs <= 2 ? '高' : '一般'))
            : x.level === '中' ? (x.cs === 0 ? '高' : '一般') : '一般';
    x.dispute = /^爭議/.test(x.note);
  }
  return out;
}
const plain = s => s.replace(/\*\*/g, '').replace(/\\([*_])/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

let ENTRIES = [];
const find = (sec, key) => {
  const hit = ENTRIES.find(x => x.sec === sec && x.title.includes(key));
  if (!hit) console.error(`自查題找不到條目：第 ${sec} 節，標題含「${key}」`);
  return hit;
};

/* 答案：只存本機瀏覽器，取不到也照常能用 */
const STORE = 'selfcheck-v1';
let ans = {};
try { ans = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(ans)); } catch (e) {} };
const profile = () => Object.fromEntries(PROFILE.map(p => [p.id, ans['p:'+p.id]]));
const profileDone = () => PROFILE.every(p => ans['p:'+p.id]);
const qid = q => q.sec + ':' + q.key;
const shown = (q, p) => q.entry && modOn(q.g.mod) && (!q.when || (profileDone() && q.when(p)));
const activeQs = () => { const p = profile(); return GROUPS.flatMap(g => g.qs).filter(q => shown(q, p)); };

function seg(name, opts, cur){
  return `<div class="seg" role="group">` + opts.map(([v, t, cls]) =>
    `<button type="button" data-k="${esc(name)}" data-v="${v}" class="${cls||''}" aria-pressed="${cur === v}">${t}</button>`).join('') + `</div>`;
}
const YN = [['y','做到了','yes'],['n','沒做到','no'],['s','跳過']];

function renderAsk(){
  const p = profile();
  let h = `<h2 style="border-top:0;padding-top:0;margin-top:0">基本情況<small>決定問哪些題</small></h2>`;
  for (const f of PROFILE) h += `<div class="q"><div class="txt">${f.text}</div>${seg('p:'+f.id, f.opts, ans['p:'+f.id])}</div>`;
  h += `<div class="q"><div class="txt">想查哪幾塊<small>點一下取消，不查的整塊不出題</small></div><div class="mods">`
    + MODS.map(m => `<button type="button" data-mod="${m}" aria-pressed="${modOn(m)}">${m}</button>`).join('') + `</div></div>`;
  for (const g of GROUPS){
    const qs = g.qs.filter(q => shown(q, p));
    if (!qs.length) continue;
    h += `<h2>${g.name}</h2>`;
    for (const q of qs) h += `<div class="q"><div class="txt">${esc(q.text)}${q.hint ? `<small>${esc(q.hint)}</small>` : ''}</div>${seg(qid(q), YN, ans[qid(q)])}</div>`;
  }
  document.getElementById('qs').innerHTML = h;
  const qs = activeQs(), n = qs.filter(q => ans[qid(q)]).length;
  document.getElementById('prog').textContent = profileDone() ? `已答 ${n} / ${qs.length} 題` : '先填基本情況';
}

const RANK = {'極高':0,'高':1,'一般':2}, LV = {'大':0,'中':1,'小':2}, GR = {A:0,B:1,C:2};
function card(e, also){
  const r = {'極高':'r3','高':'r2','一般':'r1'}[e.ratio];
  const lens = e.lens ? `<span class="badge plain">口徑 ${e.lens}</span>` : '';
  const alsoH = also.length ? `<div class="also">相關做法：` + also.map(a =>
    `<a href="./#e-${a.sec}-${a.n}">${esc(plain(a.title))}</a>`).join('；') + `</div>` : '';
  return `<div class="card" id="c-${e.sec}-${e.n}">
    <div class="h"><b>${esc(plain(e.title))}</b><a href="./#e-${e.sec}-${e.n}">第 ${e.sec} 節第 ${e.n} 條 →</a></div>
    ${e.human ? `<div class="human">${esc(plain(e.human))}</div>` : ''}
    <div class="badges"><span class="badge ${r}">性價比 ${e.ratio}</span><span class="badge ${e.grade}">證據 ${e.grade} 級</span><span class="badge plain">收益 ${e.level}</span>${lens}${e.dispute ? '<span class="badge warn">有爭議</span>' : ''}</div>
    <div class="cost">要花的：${esc(plain(e.cost))}</div>${alsoH}
  </div>`;
}
/* 沒做到的事按「要不要改習慣」分三堆：成本標籤裡的毅力一項直接決定 */
const PILES = [
  {will:'否', name:'一次辦完就行', sub:'做一次或者記住就夠，不用改習慣'},
  {will:'些', name:'要改一個習慣', sub:'要忍一點不適，堅持幾週就成了習慣'},
  {will:'是', name:'要長期堅持', sub:'和慣性長期對著幹，最難，挑一件慢慢來'},
];
const WILL = {'否':0,'些':1,'是':2};
const byValue = (a, b) => RANK[a.entry.ratio] - RANK[b.entry.ratio] || LV[a.entry.level] - LV[b.entry.level]
  || WILL[a.entry.will] - WILL[b.entry.will] || GR[a.entry.grade] - GR[b.entry.grade] || a.entry.cs - b.entry.cs;
function renderOut(){
  const qs = activeQs();
  const no = qs.filter(q => ans[qid(q)] === 'n').sort(byValue), yes = qs.filter(q => ans[qid(q)] === 'y');
  const answered = no.length + yes.length;

  // 各塊做到的比例，只算答了「做到 / 沒做到」的題，跳過的不進分母
  const groups = GROUPS.map(g => {
    const y = yes.filter(q => q.g === g).length, n = no.filter(q => q.g === g).length;
    return {g, y, t:y + n, pct: y + n ? y / (y + n) : 1};
  }).filter(r => r.t).sort((a, b) => a.pct - b.pct || b.t - a.t);
  document.getElementById('bars').innerHTML = groups.map(r =>
    `<div class="hbar" title="${esc(r.g.name)}：答了 ${r.t} 題，做到 ${r.y} 項"><span class="nm">${esc(r.g.name)}</span>`
    + `<span class="tr"><span class="fl" style="display:block;width:${(r.pct * 100).toFixed(0)}%"></span></span>`
    + `<span class="v">${r.y} / ${r.t}</span></div>`).join('');

  const easy = no.filter(q => q.entry.will === '否'), free = easy.filter(q => q.entry.money === '0');
  const good = no.filter(q => q.entry.ratio !== '一般'), disp = no.filter(q => q.entry.dispute);
  const weak = groups.find(r => r.t >= 2 && r.pct < 1);
  let v = `你答了 ${answered} 題，做到 <b>${yes.length}</b> 項，沒做到 <b>${no.length}</b> 項。`;
  if (answered > 0 && !no.length) v += '書裡這些事你都做到了。';
  else if (!answered) v += '你還沒有回答任何具體題目，返回答題後查看分析。';
  if (weak) v += `漏得最多的是「${esc(weak.g.name)}」，${weak.t} 項裡做到 ${weak.y} 項。`;
  if (easy.length) v += `沒做到的裡有 <b>${easy.length}</b> 項一次辦完就行，不用改習慣` + (free.length ? `，其中 ${free.length} 項不花錢。` : '。');
  if (disp.length) v += `有 ${disp.length} 項證據有爭議，先看原條目的備註再決定。`;
  document.getElementById('verdict').innerHTML = v;

  document.getElementById('sum').innerHTML =
    `<div class="tile"><b>${answered ? Math.round(yes.length / answered * 100) : 0}%</b><span>答過的題裡做到的比例</span></div>` +
    `<div class="tile"><b>${no.length}</b><span>還沒做到</span></div>` +
    `<div class="tile r3"><b>${good.length}</b><span>其中性價比高或極高</span></div>` +
    `<div class="tile r2"><b>${easy.length}</b><span>其中一次辦完就行</span></div>`;

  // 先做這三件：性價比最高的排前；同檔裡先挑不用改習慣的
  const top = no.slice(0, 3);
  const topTitle = `先做這${top.length === 3 ? '三' : top.length === 2 ? '兩' : '一'}件`;
  const alsoOf = q => (q.also || []).map(a => find(a.sec, a.key)).filter(Boolean);
  let h = '';
  if (top.length) h += `<h2>${topTitle}<small>沒做到的裡性價比最高的</small></h2><ol class="top3">`
    + top.map(q => `<li><a href="#c-${q.entry.sec}-${q.entry.n}">${esc(plain(q.entry.title))}</a> <span class="why">性價比${q.entry.ratio}，證據 ${q.entry.grade} 級，${PILES.find(p => p.will === q.entry.will)?.name ?? ''}</span></li>`).join('') + '</ol>'
    + `<div class="copy-tools">
      <button class="btn" id="copy-actions" type="button">複製這幾件事</button>
      <p class="copy-status" id="copy-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <div id="copy-fallback" hidden>
        <label for="copy-text">行動清單</label>
        <textarea id="copy-text" rows="10" readonly aria-describedby="copy-status"></textarea>
      </div>
    </div>`;
  for (const p of PILES){
    const list = no.filter(q => q.entry.will === p.will);
    if (!list.length) continue;
    h += `<h2>${p.name}（${list.length} 項）<small>${p.sub}</small></h2>` + list.map(q => card(q.entry, alsoOf(q))).join('');
  }
  document.getElementById('todo').innerHTML = h;
  if (top.length) document.getElementById('copy-text').value = `高性價比人生指南 · ${topTitle}\n\n` + top.map(({entry:e}) =>
    `- [ ] ${plain(e.title)}\n`
    + `  性價比${e.ratio}，證據 ${e.grade} 級，${PILES.find(p => p.will === e.will)?.name ?? ''}${e.dispute ? '，有爭議（先看原條目的備註）' : ''}\n`
    + `  要花的：${plain(e.cost)}\n`
    + `  https://dr-data.github.io/HowToLiveBetter/#e-${e.sec}-${e.n}`).join('\n\n');
  document.getElementById('done').innerHTML = yes.map(q =>
    `<li><a href="./#e-${q.entry.sec}-${q.entry.n}">${esc(plain(q.entry.title))}</a></li>`).join('');
  document.getElementById('done-h').hidden = !yes.length;
}

function show(which){
  document.getElementById('ask').hidden = which !== 'ask';
  document.getElementById('out').hidden = which !== 'out';
  scrollTo(0, 0);
}

document.getElementById('todo').addEventListener('click', async ev => {
  const b = ev.target.closest('#copy-actions'); if (!b) return;
  const status = document.getElementById('copy-status'), fallback = document.getElementById('copy-fallback');
  const text = document.getElementById('copy-text');
  b.disabled = true;
  fallback.hidden = true;
  status.textContent = '正在複製…';
  try {
    await navigator.clipboard.writeText(text.value);
    if (b.isConnected && !document.getElementById('out').hidden) status.textContent = '已複製，可以粘貼到備忘錄或待辦應用。';
  } catch (err) {
    // 等待剪貼板權限時可能已經返回改答案，不把焦點拉回舊結果。
    if (!b.isConnected || document.getElementById('out').hidden) return;
    fallback.hidden = false;
    status.textContent = '無法自動複製，請在下方手動複製清單。';
    text.focus();
    text.select();
    text.scrollTop = 0;
  } finally {
    b.disabled = false;
  }
});

document.getElementById('qs').addEventListener('click', ev => {
  const mb = ev.target.closest('button[data-mod]');
  if (mb) { ans['mod:' + mb.dataset.mod] = modOn(mb.dataset.mod) ? 'off' : undefined; save(); renderAsk(); return; }
  const b = ev.target.closest('button[data-k]'); if (!b) return;
  ans[b.dataset.k] = ans[b.dataset.k] === b.dataset.v ? undefined : b.dataset.v;
  save(); renderAsk();
});
document.getElementById('go').addEventListener('click', () => {
  if (!profileDone()) { document.getElementById('prog').textContent = '先把基本情況三題填上'; return; }
  renderOut(); show('out');
});
document.getElementById('back').addEventListener('click', () => show('ask'));
document.getElementById('reset').addEventListener('click', () => { ans = {}; save(); renderAsk(); });

(async function init(){
  const status = document.getElementById('status');
  try {
    const EMBED = window.__CORPUS__;
    const readme = EMBED ? EMBED.readme : await (await fetch('README.md', {cache:'no-cache'})).text();
    const files = [...new Set(Array.from(readme.matchAll(/\]\((book\/[^)]+\.md)\)/g), m => m[1]))]
      .filter(f => GROUPS.some(g => g.qs.some(q => f.startsWith(`book/${String(q.sec).padStart(2,'0')}-`))));
    const parts = await Promise.all(files.map(async f => EMBED ? EMBED.parts[f] : (await fetch(f, {cache:'no-cache'})).text()));
    ENTRIES = parse(parts.join('\n\n'));
    for (const g of GROUPS) for (const q of g.qs) { q.g = g; q.entry = find(q.sec, q.key); }
    status.remove();
    renderAsk(); show('ask');
  } catch (err) {
    status.textContent = location.protocol === 'file:'
      ? '這個頁面要通過 http 打開才能讀取正文。'
      : `讀取正文失敗：${err.message}`;
  }
})();
</script>
